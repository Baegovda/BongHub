name: repo check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version strings
        run: bash .github/scripts/check-versions.sh

      - name: PR does not carry human edits under data/
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-data-pr.sh "$BASE_SHA"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Notes config patch
        run: dotnet run --project BongHub.PatchTests/BongHub.PatchTests.csproj -c Release --nologo

  # WPF windows are created off-screen (--off). The runner still needs a desktop session, which windows-latest has.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish BongHub
        run: |
          dotnet publish BongHub/BongHub.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path artifacts/publish/coreclr.dll)) { Write-Error 'self-contained publish is missing coreclr.dll'; exit 1 }
          if (-not (Test-Path artifacts/publish/BongHub.dll)) { Write-Error 'BongHub.dll missing; single-file publish is not used'; exit 1 }

      - name: Build patch tests
        run: dotnet build BongHub.PatchTests/BongHub.PatchTests.csproj -c Release --nologo

      - name: WPF RTF round trip (no GUI)
        run: dotnet run --project BongHub.RichEditTests/BongHub.RichEditTests.csproj -c Release --nologo

      - name: Smoke test
        run: |
          $out = Join-Path (Get-Location) "artifacts/smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Join-Path (Get-Location) "artifacts/publish/BongHub.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList @('--smoketest', '--out', $out) -PassThru
          if (-not $p.WaitForExit(120000)) {
            try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch { }
            Write-Error "smoketest did not exit within 120s"
            exit 1
          }
          $log = Join-Path $out "smoketest.txt"
          $beside = Join-Path (Split-Path $exe) "smoketest.txt"
          if (-not (Test-Path $log) -and (Test-Path $beside)) { Copy-Item $beside $log }
          if (-not (Test-Path $log)) { Write-Error "smoketest.txt missing (exit $($p.ExitCode))"; exit 1 }
          Get-Content $log
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Note test
        if: always()
        run: |
          $copy = Join-Path (Get-Location) "artifacts/notes-data"
          $out = Join-Path (Get-Location) "artifacts/notes"
          $exe = Join-Path (Get-Location) "artifacts/publish/BongHub.exe"
          Copy-Item -Recurse data $copy
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $p = Start-Process -FilePath $exe -ArgumentList @('--notetest', '--data', $copy, '--out', $out) -Wait -PassThru
          $log = Join-Path $out "notetest.txt"
          $beside = Join-Path (Split-Path $exe) "notetest.txt"
          if (-not (Test-Path $log) -and (Test-Path $beside)) { Copy-Item $beside $log }
          if (-not (Test-Path $log)) { Write-Error "notetest.txt missing (exit $($p.ExitCode))"; exit 1 }
          Get-Content $log
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-tests
          path: |
            artifacts/smoke/smoketest.txt
            artifacts/smoke/settings_presets.png
            artifacts/smoke/settings_profile.png
            artifacts/notes/notetest.txt
          if-no-files-found: error
