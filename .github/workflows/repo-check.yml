name: repo check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version strings
        run: bash .github/scripts/check-versions.sh

      - name: PR does not carry human edits under data/
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-data-pr.sh "$BASE_SHA"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Notes config patch
        run: dotnet run --project next/BongHub.Next.PatchTests/BongHub.Next.PatchTests.csproj -c Release --nologo

  # Compiles only. Smoke and note tests open WPF windows, so they stay on the owner PC.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish BongHub.Next
        run: dotnet publish next/BongHub.Next/BongHub.Next.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true

      - name: Build patch tests
        run: dotnet build next/BongHub.Next.PatchTests/BongHub.Next.PatchTests.csproj -c Release --nologo

      - name: Build tray (warnings are errors)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File app\build.ps1
