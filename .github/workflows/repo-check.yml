name: repo check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version strings
        run: bash .github/scripts/check-versions.sh

      - name: PR does not carry human edits under data/
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/check-data-pr.sh "$BASE_SHA"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Notes config patch
        run: dotnet run --project BongHub.PatchTests/BongHub.PatchTests.csproj -c Release --nologo

  # WPF windows are created off-screen (--off). The runner still needs a desktop session, which windows-latest has.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish BongHub
        run: dotnet publish BongHub/BongHub.csproj -c Release -r win-x64 --self-contained false -p:PublishReadyToRun=true

      - name: Build patch tests
        run: dotnet build BongHub.PatchTests/BongHub.PatchTests.csproj -c Release --nologo

      - name: WPF RTF round trip (no GUI)
        run: dotnet run --project BongHub.RichEditTests/BongHub.RichEditTests.csproj -c Release --nologo

      - name: Smoke test
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/bonghub-smoke" | Out-Null
          & "BongHub/bin/Release/net10.0-windows/win-x64/publish/BongHub.exe" --smoketest --out "$env:RUNNER_TEMP/bonghub-smoke"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/bonghub-smoke/smoketest.txt" -ErrorAction SilentlyContinue; exit $LASTEXITCODE }

      - name: Note test
        run: |
          $copy = Join-Path $env:RUNNER_TEMP "bonghub-notes"
          Copy-Item -Recurse data $copy
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/bonghub-notes-out" | Out-Null
          & "BongHub/bin/Release/net10.0-windows/win-x64/publish/BongHub.exe" --notetest --data $copy --out "$env:RUNNER_TEMP/bonghub-notes-out"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP/bonghub-notes-out/notetest.txt" -ErrorAction SilentlyContinue; exit $LASTEXITCODE }

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-tests
          path: |
            ${{ runner.temp }}/bonghub-smoke/smoketest.txt
            ${{ runner.temp }}/bonghub-notes-out/notetest.txt
          if-no-files-found: ignore
